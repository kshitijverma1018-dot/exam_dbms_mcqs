<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Quiz - 6 Sets</title>
<style>
body {font-family:Arial,sans-serif;background:#f0f2f5;padding:20px; display:flex; justify-content:center;}
.quiz-container {width:90%; max-width:900px; background:white; border-radius:20px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1);}
.tabs {display:flex; border-bottom:2px solid #ccc; margin-bottom:20px;}
.tab {flex:1; text-align:center; padding:10px; cursor:pointer; background:#e0e0e0; border-radius:10px 10px 0 0; margin-right:2px; transition:all 0.3s;}
.tab:last-child{margin-right:0;}
.tab.active {background:#667eea; color:white; font-weight:bold;}
.tab-content {display:none;}
.tab-content.active {display:block;}
.question-container {margin-bottom:20px;}
.question-number {color:#667eea; font-weight:bold; margin-bottom:10px;}
.question-text {font-size:1.2em; margin-bottom:10px;}
.options-container {display:flex; flex-direction:column; gap:10px;}
.option {padding:10px; border:2px solid #ccc; border-radius:10px; cursor:pointer; transition:all 0.2s;}
.option:hover {background:#e3f2fd;}
.option.correct {background:#28a745;color:white;border-color:#28a745;}
.option.wrong {background:#dc3545;color:white;border-color:#dc3545;}
.quiz-controls {display:flex; justify-content:space-between; margin-top:10px;}
.btn {padding:8px 15px; border:none; border-radius:20px; cursor:pointer; font-weight:bold;}
.btn-primary {background:#667eea;color:white;}
.btn-primary:disabled {opacity:0.5; cursor:not-allowed;}
.results-container {display:none; text-align:center; margin-top:20px;}
.score-display {font-size:1.5em; font-weight:bold;}
.score-breakdown {display:flex; justify-content:space-around; margin-top:10px;}
.score-item{text-align:center;}
.score-value{font-size:1.2em; color:#667eea;}
</style>
</head>
<body>
<div class="quiz-container">
    <div class="tabs">
        <div class="tab active" data-set="0">Set 1</div>
        <div class="tab" data-set="1">Set 2</div>
        <div class="tab" data-set="2">Set 3</div>
        <div class="tab" data-set="3">Set 4</div>
        <div class="tab" data-set="4">Set 5</div>
        <div class="tab" data-set="5">Set 6</div>
    </div>

    <div id="tabContents">
        <!-- Six tab contents will be generated via JS -->
    </div>
</div>

<script>
// Quiz data (example for first set only, add all 6 sets like previous example)
const quizSets = [
    [ /* Set 1 */
        {question:"Which of the following is true about 1NF?", options:["No partial dependency","No multi-valued attributes","No transitive dependency","Every determinant is a candidate key"], correct:1},
        {question:"A relation is in 2NF if:", options:["It is in 1NF and has no partial dependency","It has no multi-valued attributes","It has no transitive dependency","Every determinant is a candidate key"], correct:0},
        {question:"Consider a relation R(A, B, C, D) with FDs: A→B, B→C, C→D. Which normal form does R violate?", options:["1NF","2NF","3NF","BCNF"], correct:2},
        {question:"A relation is in 3NF if:", options:["It is in 2NF and no transitive dependency exists","It is in 1NF and no partial dependency exists","Every non-prime attribute is fully functionally dependent on the primary key","Both a and c"], correct:3},
        {question:"Which of the following is the highest normal form among these?", options:["2NF","3NF","BCNF","1NF"], correct:2},
        {question:"If a relation is in BCNF, then it is always in:", options:["1NF only","2NF only","3NF also","None of the above"], correct:2},
        {question:"Which of the following statements is false?", options:["3NF allows transitive dependency on a candidate key","BCNF is stricter than 3NF","In BCNF, left-hand side of every FD is a super key","2NF ensures no partial dependency"], correct:0},
        {question:"Suppose a relation R has attributes (EmpID, EmpName, DeptID, DeptName). EmpID → EmpName, DeptID; DeptID → DeptName. What is the highest normal form of R?", options:["1NF","2NF","3NF","BCNF"], correct:2},
        {question:"Decomposition of a relation into 2 or more relations is done to:", options:["Reduce redundancy","Avoid anomalies","Ensure dependency preservation","All of the above"], correct:3},
        {question:"Which of the following anomalies can occur if a table is not normalized?", options:["Insertion anomaly","Deletion anomaly","Update anomaly","All of the above"], correct:3}
    ],
    [
    {question:"Which of the following is a reason for normalization?", options:["To reduce redundancy","To avoid anomalies","To make queries faster","Both a and b"], correct:3},
    {question:"A table in 1NF but not in 2NF must have:", options:["Transitive dependency","Partial dependency","Multi-valued dependency","Candidate keys"], correct:1},
    {question:"If a relation is in 3NF, which anomalies can still exist?", options:["Update anomalies","Deletion anomalies","Insertion anomalies","None of the above"], correct:3},
    {question:"Which of the following is true about BCNF?", options:["Every 3NF relation is in BCNF","Every BCNF relation is in 3NF","BCNF allows partial dependency","BCNF allows transitive dependency"], correct:1},
    {question:"In normalization, when decomposition is done, which property is most important?", options:["Dependency preservation","Lossless join","Redundancy elimination","All of the above"], correct:1},
    {question:"A relation R(A, B, C) with FDs: A→B, B→C. Primary key = A. This relation is in:", options:["1NF only","2NF only","3NF but not BCNF","BCNF"], correct:2},
    {question:"Which normal form is based on the concept of multi-valued dependency?", options:["2NF","3NF","BCNF","4NF"], correct:3},
    {question:"A relation is in 4NF if:", options:["It is in BCNF and has no multi-valued dependencies","It is in 2NF and has no transitive dependency","It is in 1NF and has no partial dependency","It is in 3NF and has no derived attributes"], correct:0},
    {question:"Which normal form removes join dependency?", options:["2NF","3NF","4NF","5NF"], correct:3},
    {question:"Which of the following is true?", options:["2NF ⊂ 3NF ⊂ BCNF","1NF ⊂ 2NF ⊂ 3NF ⊂ BCNF","BCNF ⊂ 3NF ⊂ 2NF","3NF ⊂ 2NF ⊂ 1NF"], correct:1}
    ],
    /* Set 3 Q21-Q30 */
    [
    {question:"Which type of dependency is removed in 2NF?", options:["Transitive dependency","Multi-valued dependency","Partial dependency","Join dependency"], correct:2},
    {question:"A relation in 3NF is always free from:", options:["Partial dependency","Transitive dependency","Multi-valued dependency","Both a and b"], correct:3},
    {question:"Which of the following is an example of update anomaly?", options:["Deleting a row removes vital info about another entity","Inserting data requires null values","Changing department name in one tuple but not in others","All of the above"], correct:2},
    {question:"In a relation R(A, B, C), suppose we have A → B and B → A. What does this imply?", options:["A and B are candidate keys","Only A is a candidate key","Only B is a candidate key","Neither A nor B is a key"], correct:0},
    {question:"Which normal form is concerned with eliminating redundancy due to multi-valued dependencies?", options:["2NF","3NF","4NF","5NF"], correct:2},
    {question:"Consider R(StuID, CourseID, Instructor). FDs: StuID, CourseID → Instructor; Instructor → CourseID. The relation violates:", options:["1NF","2NF","3NF","BCNF"], correct:3},
    {question:"Which is the highest normal form that can be achieved in practice without losing dependency preservation in most cases?", options:["2NF","3NF","BCNF","5NF"], correct:1},
    {question:"A relation is in 5NF if:", options:["It is in 4NF and every join dependency is implied by candidate keys","It is in 3NF and has no transitive dependency","It has no multi-valued dependency","It has only one candidate key"], correct:0},
    {question:"Which of the following is not true about 1NF?", options:["All attributes must have atomic values","Repeating groups are not allowed","Composite attributes are allowed","Multi-valued attributes are not allowed"], correct:2},
    {question:"If a table is in 6NF, then it is also in:", options:["1NF, 2NF, 3NF only","4NF and 5NF","2NF, 3NF, 4NF, 5NF","All lower normal forms"], correct:3}
    ],
    /* Set 4 Q31-Q40 */
    [
    {question:"Which of the following anomalies occur if a relation is not normalized?", options:["Insertion anomaly","Deletion anomaly","Update anomaly","All of the above"], correct:3},
    {question:"If a relation is in BCNF, then it is also in:", options:["2NF and 3NF","4NF and 5NF","Only 3NF","Only 2NF"], correct:0},
    {question:"Which normal form ensures that there is no transitive dependency?", options:["1NF","2NF","3NF","BCNF"], correct:2},
    {question:"A relation R(A, B, C, D) with FDs: A→B, B→C, A→D. Which is the primary key?", options:["A","B","AB","AC"], correct:0},
    {question:"Which of the following is true about partial dependency?", options:["Occurs when non-prime attribute depends on a part of composite key","Occurs when attribute depends on a transitive chain","Occurs when attribute depends on multi-valued dependency","None of the above"], correct:0},
    {question:"5NF deals with:", options:["Partial dependency","Transitive dependency","Multi-valued dependency","Join dependency"], correct:3},
    {question:"Which of the following is the main goal of 3NF?", options:["Eliminate repeating groups","Eliminate partial dependency","Eliminate transitive dependency","Eliminate join dependency"], correct:2},
    {question:"If a relation has only trivial functional dependencies, it is in:", options:["1NF","2NF","BCNF","All higher normal forms"], correct:3},
    {question:"Suppose we have a table Student(ID, Name, Course, Instructor). ID→Name, Course→Instructor. Which is the highest normal form?", options:["1NF","2NF","3NF","BCNF"], correct:2},
    {question:"Which of the following is true about 4NF?", options:["Every 4NF relation is in BCNF","Every BCNF relation is in 4NF","4NF allows multi-valued dependency","4NF and BCNF are same"], correct:2}
    ],
    /* Set 5 Q41-Q50 */
    [
    {question:"Which of the following is always true about a relation in 2NF?", options:["No multi-valued attributes","No transitive dependency","No partial dependency","Every determinant is a candidate key"], correct:2},
    {question:"If a relation has no anomalies at all, it must be in at least:", options:["1NF","2NF","3NF","BCNF"], correct:2},
    {question:"Which of the following is a superkey but not always a candidate key?", options:["Primary key","Foreign key","Any superset of a candidate key","Composite key"], correct:2},
    {question:"A relation R(A, B, C) has FDs: A→B, B→C. Which is the primary key?", options:["A","B","C","AB"], correct:0},
    {question:"Which of the following dependencies are not allowed in 3NF?", options:["Partial dependencies","Transitive dependencies","Both a and b","Multi-valued dependencies"], correct:2},
    {question:"Which normal form deals with eliminating transitive dependencies?", options:["1NF","2NF","3NF","4NF"], correct:2},
    {question:"A relation is in BCNF if:", options:["It is in 2NF and no transitive dependency exists","Every determinant is a candidate key","It has no multi-valued dependency","It is in 3NF and preserves dependency"], correct:1},
    {question:"Which of the following statements is true?", options:["Every 3NF relation is also in BCNF","Every BCNF relation is also in 3NF","2NF is stricter than 3NF","5NF is weaker than 4NF"], correct:1},
    {question:"Which of the following normal forms is based on join dependencies?", options:["3NF","4NF","5NF","6NF"], correct:2},
    {question:"If a table is decomposed to achieve higher normal form, the decomposition must be:", options:["Lossless join","Dependency preserving","Both a and b","None of the above"], correct:2}
    ],
    /* Set 6 Q51-Q60 */
    [
    {question:"Which of the following uniquely identifies a row in a table?", options:["Foreign Key","Candidate Key","Primary Key","Composite Key"], correct:2},
    {question:"Which of the following is a superkey?", options:["Any key that uniquely identifies a row","Only primary keys","Only candidate keys","Only foreign keys"], correct:0},
    {question:"Which of the following is true for a candidate key?", options:["Must be a superkey","Must be minimal","Can be more than one in a table","All of the above"], correct:3},
    {question:"Which key can accept NULL values?", options:["Primary Key","Candidate Key","Foreign Key","Super Key"], correct:2},
    {question:"Which of the following is a composite key?", options:["A key formed by combining two or more attributes","A key that uniquely identifies a row","Another name for a candidate key","A key that references another table"], correct:0},
    {question:"In a table with multiple candidate keys, one is chosen as:", options:["Super Key","Foreign Key","Primary Key","Composite Key"], correct:2},
    {question:"Which of the following is true about a foreign key?", options:["Uniquely identifies a row in the same table","Ensures referential integrity","Cannot have duplicate values","Always a candidate key"], correct:1},
    {question:"A relation R(A, B, C) has attributes: A→B, B→C. Which is a superkey?", options:["A","B","C","B, C"], correct:0},
    {question:"Which of the following keys is minimal?", options:["Super Key","Candidate Key","Primary Key","Both b and c"], correct:3},
    {question:"If a primary key is made of two attributes, it is called:", options:["Composite Key","Candidate Key","Foreign Key","Super Key"], correct:0}
    ]
     // Fill remaining sets similarly
];

let currentSet = 0;
const tabContentsDiv = document.getElementById('tabContents');

// Generate tab content for each set
quizSets.forEach((set, setIndex)=>{
    const tabContent = document.createElement('div');
    tabContent.classList.add('tab-content');
    if(setIndex===0) tabContent.classList.add('active');
    tabContent.id = 'setContent'+setIndex;

    tabContent.innerHTML = `
        <div class="question-container">
            <div class="question-number" id="questionNumber${setIndex}"></div>
            <div class="question-text" id="questionText${setIndex}"></div>
            <div class="options-container" id="optionsContainer${setIndex}"></div>
        </div>
        <div class="quiz-controls">
            <button class="btn btn-primary" id="prevBtn${setIndex}" onclick="prevQuestion(${setIndex})" style="display:none;">Previous</button>
            <button class="btn btn-primary" id="nextBtn${setIndex}" onclick="nextQuestion(${setIndex})" disabled>Next</button>
            <button class="btn btn-primary" id="submitBtn${setIndex}" onclick="submitSet(${setIndex})" style="display:none;">Submit Set</button>
        </div>
        <div class="results-container" id="resultsContainer${setIndex}">
            <h3>Set Completed!</h3>
            <div class="score-display" id="scoreDisplay${setIndex}">0/0</div>
            <div class="score-breakdown">
                <div class="score-item"><div class="score-value" id="correctAnswers${setIndex}">0</div><div>Correct</div></div>
                <div class="score-item"><div class="score-value" id="incorrectAnswers${setIndex}">0</div><div>Incorrect</div></div>
                <div class="score-item"><div class="score-value" id="percentageScore${setIndex}">0%</div><div>Score</div></div>
            </div>
        </div>
    `;
    tabContentsDiv.appendChild(tabContent);
});

let questionIndices = Array(quizSets.length).fill(0);
let userAnswers = Array(quizSets.length).fill().map(()=>Array(10).fill(null));

// Load question
function loadQuestion(setIndex){
    const qIndex = questionIndices[setIndex];
    const q = quizSets[setIndex][qIndex];
    document.getElementById('questionNumber'+setIndex).innerText = `Question ${qIndex+1} of 10`;
    document.getElementById('questionText'+setIndex).innerText = q.question;
    const container = document.getElementById('optionsContainer'+setIndex);
    container.innerHTML = '';
    q.options.forEach((opt,i)=>{
        const btn = document.createElement('button');
        btn.classList.add('option');
        btn.innerText = opt;
        btn.onclick = ()=>selectOption(setIndex,i,btn);
        container.appendChild(btn);
    });
    document.getElementById('prevBtn'+setIndex).style.display = qIndex===0?'none':'inline-block';
    document.getElementById('nextBtn'+setIndex).style.display = qIndex===9?'none':'inline-block';
    document.getElementById('submitBtn'+setIndex).style.display = qIndex===9?'inline-block':'none';
    document.getElementById('nextBtn'+setIndex).disabled = true;
}

// Select option
function selectOption(setIndex,optIndex,btn){
    const qIndex = questionIndices[setIndex];
    const q = quizSets[setIndex][qIndex];
    const container = document.getElementById('optionsContainer'+setIndex);
    Array.from(container.children).forEach(b=>b.disabled=true);
    if(optIndex===q.correct){
        btn.classList.add('correct');
    } else {
        btn.classList.add('wrong');
        container.children[q.correct].classList.add('correct');
    }
    userAnswers[setIndex][qIndex] = optIndex;
    if(qIndex<9) document.getElementById('nextBtn'+setIndex).disabled=false;
}

// Next question
function nextQuestion(setIndex){
    questionIndices[setIndex]++;
    loadQuestion(setIndex);
}

// Previous question
function prevQuestion(setIndex){
    questionIndices[setIndex]--;
    loadQuestion(setIndex);
}

// Submit set
function submitSet(setIndex){
    const setAnswers = userAnswers[setIndex];
    let correct = 0;
    setAnswers.forEach((ans,i)=>{
        if(ans===quizSets[setIndex][i].correct) correct++;
    });
    const incorrect = 10-correct;
    const percent = Math.round((correct/10)*100);
    document.getElementById('resultsContainer'+setIndex).style.display='block';
    document.getElementById('scoreDisplay'+setIndex).innerText=`${correct}/10`;
    document.getElementById('correctAnswers'+setIndex).innerText=correct;
    document.getElementById('incorrectAnswers'+setIndex).innerText=incorrect;
    document.getElementById('percentageScore'+setIndex).innerText=percent+'%';
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const setIndex = parseInt(tab.dataset.set);
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        document.getElementById('setContent'+setIndex).classList.add('active');
        currentSet = setIndex;
        loadQuestion(setIndex);
    });
});

// Load first question initially
loadQuestion(0);
</script>
</body>
</html>
